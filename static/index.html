<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a1428">
  <title>Scan inbox</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scan Inbox">
</head>
<body>
  <main>
    <header class="top">
      <h1>Scan inbox</h1>
      <div class="source-controls" aria-label="Scan sources">
        <button id="toggle" class="primary camera-only" type="button">Start camera</button>
        <button id="insert-open" class="icon-button" type="button" aria-label="Insert text" title="Insert text">
          <svg class="icon icon-text" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M12 5v14M8 19h8"/></svg>
        </button>
        <button id="photo-open" class="icon-button camera-only" type="button" aria-label="Take a photo and scan it" title="Take a photo and scan it">
          <svg class="icon icon-camera" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 7.5h3l1.4-2h4.2l1.4 2h3A2.5 2.5 0 0 1 21 10v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17v-7a2.5 2.5 0 0 1 2.5-2.5Z"/><circle cx="12" cy="13.5" r="3.25"/></svg>
        </button>
        <button id="upload-open" class="icon-button" type="button" aria-label="Upload an image to scan" title="Upload an image to scan">
          <svg class="icon icon-upload" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>
        </button>
        <input id="photo-input" type="file" accept="image/*" capture="environment" hidden>
        <input id="upload-input" type="file" accept="image/*" hidden>
        <span id="status" class="status" role="status" aria-live="polite"></span>
      </div>
    </header>

    <div id="banner" class="banner" role="alert" hidden>
      <span id="banner-text"></span>
      <button id="banner-reload" type="button" hidden>Reload</button>
    </div>

    <section id="scanner" class="scanner" aria-label="Scanner">
      <div id="viewfinder" class="viewfinder">
        <video id="video" playsinline muted></video>
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <p id="idle" class="idle">Camera is off</p>
      </div>
    </section>

    <section id="results" class="results" aria-label="Scans">
      <ol id="list" class="tape"></ol>
      <p id="empty" class="empty" hidden>Nothing scanned yet. Open this page on your phone, start the camera and point it at a code.</p>
      <nav id="pager" class="pager" hidden>
        <button id="newer" type="button">‹ Newer</button>
        <span class="mid"><span id="range"></span> <button id="unseen" class="unseen" type="button" hidden></button></span>
        <button id="older" type="button">Older ›</button>
      </nav>
    </section>
  </main>
  <dialog id="insert">
    <label for="insert-text" class="dialog-label">Text to save as a scan</label>
    <textarea id="insert-text" maxlength="4096" rows="6" spellcheck="false" autofocus></textarea>
    <div class="dialog-actions">
      <button id="insert-cancel" type="button">Cancel</button>
      <button id="insert-save" class="primary" type="button">Save</button>
    </div>
  </dialog>
  <dialog id="detail">
    <pre id="detail-text"></pre>
    <div class="dialog-actions">
      <button id="detail-copy" type="button">Copy</button>
      <button id="detail-close" type="button">Close</button>
    </div>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
