<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a1428">
  <title>Scan inbox</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scan Inbox">
</head>
<body>
  <main>
    <header class="top">
      <h1>Scan inbox</h1>
      <button id="insert-open" class="linklike" type="button">Insert text</button>
    </header>

    <div id="banner" class="banner" role="alert" hidden>
      <span id="banner-text"></span>
      <button id="banner-reload" type="button" hidden>Reload</button>
    </div>

    <section id="scanner" class="scanner" aria-label="Scanner">
      <div id="viewfinder" class="viewfinder">
        <video id="video" playsinline muted></video>
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <p id="idle" class="idle">Camera is off</p>
      </div>
      <div id="zoom-row" class="slider-row" hidden>
        <span class="slider-icon" aria-hidden="true">&minus;</span>
        <input id="zoom" type="range" min="0" max="1" step="0.01" value="0" aria-label="Camera zoom">
        <span class="slider-icon" aria-hidden="true">+</span>
      </div>
      <div id="focus-row" class="slider-row" hidden>
        <span class="slider-icon" aria-hidden="true">&#128065;</span>
        <input id="focus" type="range" min="0.1" max="2" step="0.01" value="0.3" aria-label="Manual focus">
        <span id="focus-value" class="slider-value" aria-live="polite">0.30 m</span>
      </div>
      <div class="controls">
        <button id="toggle" class="primary" type="button">Start camera</button>
        <span id="status" class="status" role="status" aria-live="polite"></span>
      </div>
      <p class="hint">Use the focus slider to bring close-up barcodes and QR codes into focus.</p>

      <details id="camera-diagnostics" class="camera-diagnostics">
        <summary>Camera diagnostics</summary>
        <pre id="camera-diagnostics-text">Start the camera to inspect its capabilities.</pre>
        <button id="camera-diagnostics-refresh" class="linklike" type="button">Refresh diagnostics</button>
      </details>
    </section>

    <section id="results" class="results" aria-label="Scans">
      <ol id="list" class="tape"></ol>
      <p id="empty" class="empty" hidden>Nothing scanned yet. Open this page on your phone, start the camera and point it at a code.</p>
      <nav id="pager" class="pager" hidden>
        <button id="newer" type="button">‹ Newer</button>
        <span class="mid"><span id="range"></span> <button id="unseen" class="unseen" type="button" hidden></button></span>
        <button id="older" type="button">Older ›</button>
      </nav>
    </section>
  </main>
  <dialog id="insert">
    <label for="insert-text" class="dialog-label">Text to save as a scan</label>
    <textarea id="insert-text" maxlength="4096" rows="6" spellcheck="false" autofocus></textarea>
    <div class="dialog-actions">
      <button id="insert-cancel" type="button">Cancel</button>
      <button id="insert-save" class="primary" type="button">Save</button>
    </div>
  </dialog>
  <dialog id="detail">
    <pre id="detail-text"></pre>
    <div class="dialog-actions">
      <button id="detail-copy" type="button">Copy</button>
      <button id="detail-close" type="button">Close</button>
    </div>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
